name: sitepyoe
description: SitePyoe Nursery POS & Inventory Management System — Tablet-first.
publish_to: 'none'
version: 1.5.2+8

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Local DB (offline cache)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.4
  path: ^1.9.0

  # UI / UX
  google_fonts: ^6.2.1
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  esc_pos_utils_plus: ^2.0.4
  uuid: ^4.6.0
  image_picker: ^1.2.2

  # Networking & Persistence
  http: ^1.2.1
  shared_preferences: ^2.3.0
  connectivity_plus: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
