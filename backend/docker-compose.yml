# backend/docker-compose.yml

services:
  postgres:
    image: postgres:16-alpine
    container_name: sitepyoe_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sitepyoe_secure_db_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-sitepyoe}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./db/002_vendors_purchases.sql:/docker-entrypoint-initdb.d/002_vendors_purchases.sql:ro
      - ./db/003_employees_payroll.sql:/docker-entrypoint-initdb.d/003_employees_payroll.sql:ro
      - ./db/004_schema_fixes.sql:/docker-entrypoint-initdb.d/004_schema_fixes.sql:ro
      - ./db/005_seed_catalog_and_data.sql:/docker-entrypoint-initdb.d/005_seed_catalog_and_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sitepyoe}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sitepyoe_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-sitepyoe_secure_db_pass_2026}@postgres:5432/${POSTGRES_DB:-sitepyoe}
      JWT_SECRET: ${JWT_SECRET:-sitepyoe_super_jwt_secret_change_me_production}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-sitepyoe_super_jwt_refresh_secret_change_me}
      JWT_REFRESH_EXPIRES_IN: 30d
    volumes:
      - product_uploads:/app/uploads/products

volumes:
  pgdata:
    driver: local
  product_uploads:
    driver: local

